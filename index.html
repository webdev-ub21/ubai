<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text to Video Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: white; text-align: center; padding: 50px; }
        textarea { width: 80%; height: 100px; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        button { background: #0070f3; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #videoContainer { margin-top: 30px; }
        video { width: 80%; max-width: 600px; border-radius: 10px; box-shadow: 0px 0px 15px rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <h1>Sora-like AI Video Generator</h1>
    <p>अपना आइडिया लिखें और AI वीडियो जनरेट करें</p>
    
    <textarea id="promptInput" placeholder="Ex: A futuristic city with flying cars at sunset, cinematic lighting..."></textarea><br>
    <button id="genBtn" onclick="generateVideo()">Generate Video</button>

    <div id="videoContainer">
        <p id="status"></p>
        <!-- वीडियो यहाँ दिखाई देगा -->
    </div>

    <script src="app.js"></script>
</body>
</html>
